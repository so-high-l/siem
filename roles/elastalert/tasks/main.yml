---
# tasks file for elastalert
- name: Install system dependencies for ElastAlert2
  apt:
    name:
      - build-essential
      - python3-pip
      - python3-venv
      - libffi-dev
      - libssl-dev
      - git
      - ca-certificates
    state: present
    update_cache: yes
  become: true

- name: Ensure elastalert group exists
  group:
    name: elastalert
    state: present

- name: Ensure elastalert user exists
  user:
    name: elastalert
    group: elastalert
    create_home: yes
    shell: /bin/bash
    state: present

- name: Ensure ElastAlert directory exists
  file:
    path: "{{ elastalert_dir }}"
    state: directory
    owner: elastalert
    group: elastalert
    mode: 0755

- name: Create Python 3 virtualenv for ElastAlert2
  command: python3 -m venv {{ elastalert_virtualenv }}
  args:
    creates: "{{ elastalert_virtualenv }}"

- name: Upgrade pip in virtualenv
  command: "{{ elastalert_virtualenv }}/bin/pip install --upgrade pip"

- name: Install ElastAlert2 in virtualenv
  command: "{{ elastalert_virtualenv }}/bin/pip install elastalert2 setuptools>=11.3"

- name: Ensure rules directory exists
  file:
    path: "{{ elastalert_rules_dir }}"
    state: directory
    owner: elastalert
    group: elastalert
    mode: 0755

- name: Deploy ElastAlert config
  template:
    src: config.yaml.j2
    dest: "{{ elastalert_config_file }}"
    owner: elastalert
    group: elastalert
    mode: 0640
  notify: Restart elastalert

- name: Deploy ddos rule
  template:
    src: ddos_rule.yaml.j2
    dest: "{{ elastalert_rules_dir }}/ddos_rule.yaml"
    owner: elastalert
    group: elastalert
    mode: 0640
  notify: Restart elastalert

- name: Deploy login failures rule
  template:
    src: login_failures_rule.yaml.j2
    dest: "{{ elastalert_rules_dir }}/login_failures_rule.yaml"
    owner: elastalert
    group: elastalert
    mode: 0640
  notify: Restart elastalert

- name: Deploy server error rule
  template:
    src: server_error_rule.yaml.j2
    dest: "{{ elastalert_rules_dir }}/server_error_rule.yaml"
    owner: elastalert
    group: elastalert
    mode: 0640
  notify: Restart elastalert

- name: Deploy smtp auth file
  template:
    src: smtp_auth_file.yaml.j2
    dest: "{{ smtp_auth_file }}"
    owner: elastalert
    group: elastalert
    mode: 0640
  notify: Restart elastalert

- name: Run elastalert-create-index as elastalert user (fallback)
  shell: |
    sudo -u elastalert {{ elastalert_virtualenv }}/bin/elastalert-create-index --config {{ elastalert_config_file }}
  args:
    creates: /opt/elastalert/.index_created
  register: elastalert_create_index
  changed_when: elastalert_create_index.rc == 0

- name: Create marker file after index creation
  file:
    path: /opt/elastalert/.index_created
    state: touch
    owner: elastalert
    group: elastalert
  when: elastalert_create_index.rc == 0

- name: Create systemd service
  copy:
    dest: /etc/systemd/system/elastalert.service
    content: |
      [Unit]
      Description=ElastAlert 2
      After=network.target elasticsearch.service

      [Service]
      Type=simple
      User=elastalert
      Group=elastalert
      ExecStart={{ elastalert_virtualenv }}/bin/elastalert --config {{ elastalert_config_file }}
      WorkingDirectory={{ elastalert_dir }}
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
  notify: Restart elastalert

- name: Enable and start elastalert
  systemd:
    name: elastalert
    enabled: yes
    state: started
