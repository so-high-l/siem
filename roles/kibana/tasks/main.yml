---
- name: Install Kibana
  apt:
    name: kibana
    state: present
    update_cache: yes
  become: true

- name: Copy Kibana config
  template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: 0660
  become: true

- name: Enable and start Kibana
  systemd:
    name: kibana
    enabled: yes
    state: started
  become: true

- name: Wait for Kibana to be up and running
  uri:
    url: "https://localhost:5601/api/status"
    method: GET
    user: "elastic"
    password: "{{elastic_password}}"
    force_basic_auth: true
    return_content: true
    validate_certs: false
    status_code: 200
  register: kibana_status
  retries: 30
  delay: 10
  until: kibana_status.status == 200

- name: Import Kibana dashboards
  include_tasks: import_dashboards.yml
