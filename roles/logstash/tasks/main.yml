- name: Install dependencies (Ubuntu 22.04 compatible)
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
      - curl
      - wget
    state: present
    update_cache: yes
  become: true

- name: Add Elasticsearch GPG key for Logstash
  apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present
  become: true

- name: Add Elasticsearch APT repo for Logstash (Ubuntu 22.04 compatible)
  apt_repository:
    repo: "deb https://artifacts.elastic.co/packages/9.x/apt stable main"
    state: present
    filename: elasticsearch
  become: true

- name: Install Logstash
  apt:
    name: logstash
    state: present
    update_cache: yes
  become: true

- name: Enable and start Logstash
  systemd:
    name: logstash
    enabled: yes
    state: started
    daemon_reload: yes
  become: true

- name: Ensure Logstash pipeline directory exists
  file:
    path: /etc/logstash/conf.d
    state: directory
    owner: logstash
    group: logstash
    mode: "0755"
  become: true

- name: Deploy Logstash Backend pipeline configuration
  template:
    src: backend-pipeline.conf.j2
    dest: /etc/logstash/conf.d/backend-pipeline.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Logstash
  become: true

# Deploy nginx pipeline
- name: Deploy Logstash Nginx pipeline configuration
  template:
    src: nginx-pipeline.conf.j2
    dest: /etc/logstash/conf.d/nginx-pipeline.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Logstash
  become: true

- name: Copy Logstash pipeline registry
  template:
    src: pipelines.yml.j2
    dest: /etc/logstash/pipelines.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart Logstash
  become: true

- name: Deploy logstash.yml config
  template:
    src: logstash.yml.j2
    dest: /etc/logstash/logstash.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart Logstash
  become: true
