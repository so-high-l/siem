- name: Configure Metricbeat to use Elasticsearch credentials
  blockinfile:
    path: /etc/metricbeat/metricbeat.yml
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Elasticsearch Output"
    block: |
      output.elasticsearch:
        hosts: ["elasticsearch.local:9200"]
        protocol: "https"
        username: "elastic"
        password: "{{ elastic_password }}"
        ssl.certificate_authorities: ["/etc/metricbeat/certs/ca.crt"]
        ssl.verification_mode: full
        ssl.enabled: true
  notify: Restart Metricbeat

- name: Verify Metricbeat configuration
  command: metricbeat test config
  register: metricbeat_config_test
  failed_when: metricbeat_config_test.rc != 0
  changed_when: false

- name: Restart Metricbeat to apply new configuration
  systemd:
    name: metricbeat
    state: restarted
    daemon_reload: yes
  become: true

# - name: Wait for Metricbeat to start
#   wait_for:
#     port: 5066
#     timeout: 30
#   become: true

- name: Test Metricbeat connection to Elasticsearch
  command: metricbeat test output
  register: metricbeat_output_test
  retries: 3
  delay: 10
  until: metricbeat_output_test.rc == 0
  changed_when: false
