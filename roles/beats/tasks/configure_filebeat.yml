- name: Configure Filebeat monitoring to Elasticsearch
  blockinfile:
    path: /etc/filebeat/filebeat.yml
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Filebeat Monitoring"
    block: |
      # Enable monitoring to Elasticsearch
      monitoring.enabled: true
      monitoring.elasticsearch:
        hosts: ["elasticsearch.local:9200"]
        protocol: "https"
        username: "elastic"
        password: "{{ elastic_password }}"
        ssl.certificate_authorities: ["/etc/filebeat/certs/ca.crt"]
        ssl.verification_mode: full
        ssl.enabled: true
  notify: Restart Filebeat

- name: Verify Filebeat configuration
  command: filebeat test config
  register: filebeat_config_test
  failed_when: filebeat_config_test.rc != 0
  changed_when: false

- name: Restart Filebeat to apply new configuration
  systemd:
    name: filebeat
    state: restarted
    daemon_reload: yes
  become: true

- name: Test Filebeat monitoring connection to Elasticsearch
  command: filebeat test output
  register: filebeat_output_test
  retries: 3
  delay: 10
  until: filebeat_output_test.rc == 0
  changed_when: false
