# roles/elasticsearch/tasks/main.yml
---
- name: Install dependencies
  apt:
    name:
      - apt-transport-https
      - unzip
      - openjdk-21-jdk
    state: present
    update_cache: yes
  become: true

- name: Add Elasticsearch GPG key
  apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present
  become: true

- name: Add Elasticsearch APT repo
  apt_repository:
    repo: "deb https://artifacts.elastic.co/packages/9.x/apt stable main"
    state: present
    filename: elasticsearch
  become: true

- name: Install Elasticsearch
  apt:
    name: elasticsearch=9.0.0
    state: present
    update_cache: yes
  become: true

- name: Copy elasticsearch.yml
  template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: 0660
  become: true

- name: Set JVM heap size to 50% of system memory
  lineinfile:
    path: /etc/elasticsearch/jvm.options
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    create: yes
  loop:
    - { regexp: "^-Xms", line: "-Xms{{ (ansible_memtotal_mb * 0.5) | int }}m" }
    - { regexp: "^-Xmx", line: "-Xmx{{ (ansible_memtotal_mb * 0.5) | int }}m" }
  become: true

- name: Ensure Elasticsearch directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: elasticsearch
    group: elasticsearch
    mode: 0755
  loop:
    - /var/lib/elasticsearch
    - /var/log/elasticsearch
  become: true

- name: Enable memory locking in systemd
  lineinfile:
    path: /etc/systemd/system/elasticsearch.service.d/override.conf
    create: yes
    line: |
      [Service]
      LimitMEMLOCK=infinity
  become: true

- name: Reload systemd
  command: systemctl daemon-reexec
  become: true

- name: Add elasticsearch.local to /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 elasticsearch.local"
    state: present

- name: Generate CA certificate
  import_tasks: generate_ca.yml

- name: Generate HTTP and transport certificates
  import_tasks: generate_http_transport.yml

- name: Distribute TLS certs to Kibana and Logstash
  import_tasks: distribute_certs.yml

- name: Enable and start Elasticsearch
  systemd:
    name: elasticsearch
    enabled: true
    state: started
    daemon_reload: true
  become: true

# Set up built-in user passwords if not already set
- name: Check if elastic password is already set
  uri:
    url: https://localhost:9200
    user: elastic
    password: "{{ elastic_password }}"
    validate_certs: false
    status_code: 200
  register: elastic_pw_check
  ignore_errors: true

- name: Run elasticsearch-setup-passwords if password is not set
  shell: |
    echo -e "{{ elastic_password }}\n{{ elastic_password }}\n{{ elastic_password }}\n{{ elastic_password }}\n{{ elastic_password }}\n{{ elastic_password }}\n{{ elastic_password }}\n{{ elastic_password }}" | /usr/share/elasticsearch/bin/elasticsearch-setup-passwords interactive --batch --url https://localhost:9200
  args:
    creates: /etc/elasticsearch/.passwords_set
  become: true
  when: elastic_pw_check.failed

- name: Create marker file after setting passwords
  file:
    path: /etc/elasticsearch/.passwords_set
    state: touch
  become: true
  when: elastic_pw_check.failed

- name: Create Logstash Writer Role and User in Elasticsearch
  import_tasks: create_logstash_user.yml
