- name: Ensure Kibana group exists
  group:
    name: kibana
    state: present
  become: true

- name: Ensure Kibana cert directory exists
  file:
    path: /etc/kibana/certs
    state: directory
    owner: root
    group: kibana
    mode: "0755"
  become: true

- name: Copy HTTP cert to Kibana
  copy:
    src: /etc/elasticsearch/certs/http/elasticsearch.local.crt
    dest: /etc/kibana/certs/http.crt
    remote_src: true
    owner: root
    group: kibana
    mode: "0644"
  become: true

- name: Copy HTTP key to Kibana
  copy:
    src: /etc/elasticsearch/certs/http/elasticsearch.local.key
    dest: /etc/kibana/certs/http.key
    remote_src: true
    owner: root
    group: kibana
    mode: "0640"
  become: true

- name: Copy CA cert to Kibana
  copy:
    src: /etc/elasticsearch/certs/ca/ca.crt
    dest: /etc/kibana/certs/ca.crt
    remote_src: true
    owner: root
    group: kibana
    mode: "0644"
  become: true

