---
# 1. Generate CA if it doesn't exist
- name: Check if CA cert already exists
  stat:
    path: /etc/elasticsearch/certs/ca/ca.crt
  register: ca_stat

- name: Create certs directory
  file:
    path: /etc/elasticsearch/certs/ca
    state: directory
    mode: "0750"
    owner: root
    group: elasticsearch

- name: Generate CA certificate
  command: >
    /usr/share/elasticsearch/bin/elasticsearch-certutil ca
    --silent
    --pem
    --out /etc/elasticsearch/certs/ca/elastic-stack-ca.zip
  args:
    creates: /etc/elasticsearch/certs/ca/elastic-stack-ca.zip

- name: Install unzip package (required for extracting certs)
  apt:
    name: unzip
    state: present
    update_cache: yes
  become: true

- name: Unzip CA certs
  unarchive:
    src: /etc/elasticsearch/certs/ca/elastic-stack-ca.zip
    dest: /etc/elasticsearch/certs/ca/
    remote_src: yes
    extra_opts: ["-j"]
  when: not ca_stat.stat.exists

# 2. Generate HTTP certificate
- name: Check if HTTP cert exists
  stat:
    path: /etc/elasticsearch/certs/http/http.crt
  register: http_cert

- name: Create HTTP certs directory
  file:
    path: /etc/elasticsearch/certs/http
    state: directory
    mode: "0750"
    owner: root
    group: elasticsearch

- name: Generate HTTP certificate
  command: >
    /usr/share/elasticsearch/bin/elasticsearch-certutil cert
    --silent
    --pem
    --ca-cert /etc/elasticsearch/certs/ca/ca.crt
    --ca-key /etc/elasticsearch/certs/ca/ca.key
    --name http
    --out /etc/elasticsearch/certs/http/http-cert.zip
  args:
    creates: /etc/elasticsearch/certs/http/http-cert.zip

- name: Unzip HTTP certs
  unarchive:
    src: /etc/elasticsearch/certs/http/http-cert.zip
    dest: /etc/elasticsearch/certs/http/
    remote_src: yes
    extra_opts: ["-j"]

  when: not http_cert.stat.exists

# 3. Generate Node (transport) cert
- name: Check if transport cert exists
  stat:
    path: /etc/elasticsearch/certs/transport/transport.crt
  register: transport_cert

- name: Create transport cert directory
  file:
    path: /etc/elasticsearch/certs/transport
    state: directory
    mode: "0750"
    owner: root
    group: elasticsearch

- name: Generate node (transport) certificate
  command: >
    /usr/share/elasticsearch/bin/elasticsearch-certutil cert
    --silent
    --pem
    --ca-cert /etc/elasticsearch/certs/ca/ca.crt
    --ca-key /etc/elasticsearch/certs/ca/ca.key
    --name transport
    --out /etc/elasticsearch/certs/transport/transport-cert.zip
  args:
    creates: /etc/elasticsearch/certs/transport/transport-cert.zip

- name: Unzip transport certs
  unarchive:
    src: /etc/elasticsearch/certs/transport/transport-cert.zip
    dest: /etc/elasticsearch/certs/transport/
    remote_src: yes
    extra_opts: ["-j"]

  when: not transport_cert.stat.exists

- name: Remove CA ZIP archive after extraction
  file:
    path: /etc/elasticsearch/certs/ca/elastic-stack-ca.zip
    state: absent
  become: true

- name: Clean up all ZIP certificate archives
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/elasticsearch/certs/ca/elastic-stack-ca.zip
    - /etc/elasticsearch/certs/http/http-cert.zip
    - /etc/elasticsearch/certs/transport/transport-cert.zip
  ignore_errors: true
  become: true
